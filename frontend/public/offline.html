<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Goal Tracker — Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2563eb 0%, #9333ea 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      color: white;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      max-width: 360px;
    }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { opacity: 0.85; font-size: 14px; line-height: 1.5; margin: 0; }
    button {
      margin-top: 20px;
      background: white;
      color: #2563eb;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 40px;">🎯</div>
    <h1>You're offline</h1>
    <p>Goal Tracker needs a connection to load your goals and todos. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
